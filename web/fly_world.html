function base64ToFloat32Array(b64) {
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new Float32Array(bytes.buffer);
}

const EB_W_FLAT = base64ToFloat32Array(EB_W_B64);   // row-major (post, pre)
const EB_ANGLES = base64ToFloat32Array(EB_ANGLES_B64);

// Split into excitatory/inhibitory parts once, matching lif_simulator.py
const EB_W_EXC = new Float32Array(EB_N * EB_N);
const EB_W_INH = new Float32Array(EB_N * EB_N);
for (let i = 0; i < EB_N * EB_N; i++) {
  const w = EB_W_FLAT[i];
  if (w > 0) EB_W_EXC[i] = w; else if (w < 0) EB_W_INH[i] = w;
}

// ==== JS port of lif_simulator.py's LIFNetwork, scoped to the 274-neuron
// EB submatrix, using the same tuned parameters found in Phase 3 ====
class EBNetwork {
  constructor() {
    this.n = EB_N;
    this.V = new Float32Array(this.n);
    this.Isyn = new Float32Array(this.n);
    this.refractoryUntil = new Int32Array(this.n);
    this.lastSpikes = new Float32Array(this.n);
    this.step_count = 0;

    // tuned parameters from Phase 1/3 grid search
    this.tauMs = 20.0;
    this.tauSynMs = 5.0;
    this.vThresh = 1.0;
    this.refractorySteps = 2;
    this.scaleExc = 0.003;
    this.scaleInh = 0.002; // low-inhibition regime: best localization accuracy
                           // (Phase 3 found ~7-12 deg error here; persistence
                           // was worse at this setting, but we don't need
                           // persistence for continuously-driven seeking)
    this.dtMs = 1.0;
    this.synDecay = Math.exp(-this.dtMs / this.tauSynMs);

    // rolling spike history window for population-vector decoding
    this.window = 20;
    this.history = [];
    for (let i = 0; i < this.window; i++) this.history.push(new Float32Array(this.n));
    this.historyIdx = 0;
  }

  step(externalInput) {
    this.step_count++;
    const n = this.n;
    const excIn = new Float32Array(n);
    const inhIn = new Float32Array(n);
    for (let post = 0; post < n; post++) {
      let se = 0, si = 0;
      const base = post * n;
      for (let pre = 0; pre < n; pre++) {
        const s = this.lastSpikes[pre];
        if (s !== 0) {
          se += EB_W_EXC[base + pre] * s;
          si += EB_W_INH[base + pre] * s;
        }
      }
      excIn[post] = se * this.scaleExc;
      inhIn[post] = si * this.scaleInh;
    }

    const spiked = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      this.Isyn[i] = this.Isyn[i] * this.synDecay + excIn[i] + inhIn[i];
      const total = this.Isyn[i] + (externalInput ? externalInput[i] : 0);
      const notRefractory = this.step_count > this.refractoryUntil[i];
      if (notRefractory) {
        this.V[i] += (this.dtMs / this.tauMs) * (0 - this.V[i]) + total;
      } else {
        this.V[i] = 0;
      }
      if (this.V[i] >= this.vThresh && notRefractory) {
        spiked[i] = 1;
        this.V[i] = 0;
        this.refractoryUntil[i] = this.step_count + this.refractorySteps;
      }
    }
    this.lastSpikes = spiked;
    this.history[this.historyIdx % this.window] = spiked;
    this.historyIdx++;
    return spiked;
  }

  // population-vector decode over the recent spike window. Returns
  // {angle, confidence} -- confidence is total recent spike count,
  // used by the caller to decide whether to trust the decode at all.
  decode() {
    let sumX = 0, sumY = 0, total = 0;
    for (let w = 0; w < this.window; w++) {
      const spikes = this.history[w];
      for (let i = 0; i < this.n; i++) {
        const s = spikes[i];
        if (s !== 0) {
          sumX += s * Math.cos(EB_ANGLES[i]);
          sumY += s * Math.sin(EB_ANGLES[i]);
          total += s;
        }
      }
    }
    if (total === 0) return { angle: null, confidence: 0 };
    return { angle: Math.atan2(sumY, sumX), confidence: total };
  }
}

const ebNetwork = new EBNetwork();

// Drive the network toward a relative bearing (angle to target, relative
// to the fly's own current heading), matching the cosine tuning used in
// the Python bump_test.py / phase3 experiments. Call this every rendered
// frame with several internal LIF steps for stability.
const EB_INPUT_STRENGTH = 1.5;
const EB_BASELINE_DRIVE = 0.15;
const STEPS_PER_FRAME = 8;

function driveEBTowardBearing(relativeBearing) {
  const ext = new Float32Array(EB_N);
  for (let i = 0; i < EB_N; i++) {
    const tuning = Math.max(0, Math.cos(relativeBearing - EB_ANGLES[i]));
    ext[i] = EB_BASELINE_DRIVE + EB_INPUT_STRENGTH * tuning;
  }
  let result = { angle: null, confidence: 0 };
  for (let s = 0; s < STEPS_PER_FRAME; s++) {
    ebNetwork.step(ext);
  }
  return ebNetwork.decode();
}

(function () {
  const scene = new THREE.Scene();

    new THREE.PlaneGeometry(ROOM * 2, ROOM * 2),
    new THREE.MeshStandardMaterial({ color: 0x3a2f22, roughness: 1 })
  );

  scene.add(floor);

  const wallMat = new THREE.MeshStandardMaterial({ color: 0x22301f, roughness: 0.9 });
  const wallH = 6;
  const staticObstacles = [];
  [[0, -ROOM, ROOM * 2, wallH, 0], [0, ROOM, ROOM * 2, wallH, 0],
   [-ROOM, 0, wallH, ROOM * 2, 1], [ROOM, 0, wallH, ROOM * 2, 1]].forEach(([x, z, w, h, rot]) => {
    const geo = rot ? new THREE.BoxGeometry(0.6, h, w) : new THREE.BoxGeometry(w, h, 0.6);
    const wall = new THREE.Mesh(geo, wallMat);
    wall.position.set(x, h / 2, z);
    wall.userData.isObstacle = true;
    wall.userData.radius = 1;
    scene.add(wall);
    staticObstacles.push(wall);
  });

  // ---- living obstacles: drift, rotate, breathe in size, occasionally
  // get replaced so the room never looks frozen ----
  const livingObstacles = [];
  const obsMat = new THREE.MeshStandardMaterial({ color: 0x4a3f2f, roughness: 1 });

  function makeObstacle() {
    const baseSize = 1.1 + Math.random() * 1.5;
    const box = new THREE.Mesh(new THREE.BoxGeometry(1, 1.5, 1), obsMat);
    let x, z, tries = 0;
    do {
      x = (Math.random() - 0.5) * ROOM * 1.6;
      z = (Math.random() - 0.5) * ROOM * 1.6;
      tries++;
    } while (tries < 15 && Math.hypot(x, z) < 4);
    box.position.set(x, baseSize * 0.75, z);
    box.userData = {
      isObstacle: true,
      baseSize,
      radius: baseSize * 0.9,
      phase: Math.random() * Math.PI * 2,
      driftDir: Math.random() * Math.PI * 2,
      driftSpeed: 0.15 + Math.random() * 0.25,
      spinSpeed: (Math.random() - 0.5) * 0.4,
      birthTime: performance.now(),
      lifespan: 18000 + Math.random() * 14000, // ms before it fades and respawns
    };
    scene.add(box);
    livingObstacles.push(box);
  }
  for (let i = 0; i < 7; i++) makeObstacle();

  function allObstacles() { return staticObstacles.concat(livingObstacles); }

  // ---- food, gently pulsing ----

  function spawnFood() {
    let pos, tries = 0;
    do {
      pos = new THREE.Vector3((Math.random() - 0.5) * ROOM * 1.7, 0.6, (Math.random() - 0.5) * ROOM * 1.7);
      tries++;
    } while (tries < 20 && allObstacles().some(o => o.position.distanceTo(pos) < (o.userData.radius || 1) + 1.5));
    const food = new THREE.Mesh(
      new THREE.SphereGeometry(0.35, 12, 12),
      new THREE.MeshStandardMaterial({ color: 0xd9c26a, emissive: 0x554311, roughness: 0.4 })
    );
    food.position.copy(pos);
    food.userData.phase = Math.random() * Math.PI * 2;
    scene.add(food);
    foods.push(food);
  }
  for (let i = 0; i < 5; i++) spawnFood();

  // ---- ambient floating dust motes, purely atmospheric ----
  const moteGeo = new THREE.SphereGeometry(0.03, 4, 4);
  const moteMat = new THREE.MeshBasicMaterial({ color: 0xbfd4c2, transparent: true, opacity: 0.5 });
  const motes = [];
  for (let i = 0; i < 40; i++) {
    const m = new THREE.Mesh(moteGeo, moteMat);
    m.position.set((Math.random() - 0.5) * ROOM * 2, Math.random() * 5 + 0.5, (Math.random() - 0.5) * ROOM * 2);
    m.userData.speed = 0.1 + Math.random() * 0.2;
    m.userData.phase = Math.random() * Math.PI * 2;
    scene.add(m);
    motes.push(m);

  // ---- the fly ----
  const fly = new THREE.Group();
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0x1a1a22, roughness: 0.5, metalness: 0.3 });
  const abdomen = new THREE.Mesh(new THREE.SphereGeometry(0.35, 10, 10), bodyMat);
  abdomen.scale.set(1, 0.8, 1.6);

  const thorax = new THREE.Mesh(new THREE.SphereGeometry(0.22, 10, 10), bodyMat);

  const wingGeo = new THREE.PlaneGeometry(0.7, 0.3);

  let heading = Math.random() * Math.PI * 2;
  let mode = "wandering";
  const speed = 3.2;
  const turnRate = 2.2;
  const rayAngles = [-0.6, -0.3, 0, 0.3, 0.6];

  function castRay(origin, angle, dist) {
    const dir = new THREE.Vector3(Math.sin(angle), 0, Math.cos(angle));

      const toObs = o.position.clone().sub(origin);
      const proj = toObs.dot(dir);
      if (proj < 0 || proj > dist) continue;
      const closest = origin.clone().add(dir.clone().multiplyScalar(proj));
      if (closest.distanceTo(o.position) < (o.userData.radius || 1)) return proj;

    return dist;
  }

  function updateEnvironment(now, dt) {
    // obstacles drift, spin, breathe in size, and eventually fade + respawn
    for (let i = livingObstacles.length - 1; i >= 0; i--) {
      const o = livingObstacles[i];
      const age = now - o.userData.birthTime;
      const lifeFrac = age / o.userData.lifespan;

      if (lifeFrac > 1) {
        scene.remove(o);
        livingObstacles.splice(i, 1);
        makeObstacle();
        continue;
      }

      // fade in for first 8%, fade out for last 8% of life, via scale
      const fadeIn = Math.min(1, lifeFrac / 0.08);
      const fadeOut = Math.min(1, (1 - lifeFrac) / 0.08);
      const envelope = Math.min(fadeIn, fadeOut);
      const breathe = 1 + Math.sin(now * 0.0007 + o.userData.phase) * 0.12;
      const scale = envelope * breathe;
      o.scale.set(scale, scale, scale);
      o.userData.radius = o.userData.baseSize * 0.9 * scale;

      // slow drift, bouncing softly off the walls
      const dx = Math.sin(o.userData.driftDir) * o.userData.driftSpeed * dt;
      const dz = Math.cos(o.userData.driftDir) * o.userData.driftSpeed * dt;
      o.position.x += dx;
      o.position.z += dz;
      if (Math.abs(o.position.x) > ROOM - 2 || Math.abs(o.position.z) > ROOM - 2) {
        o.userData.driftDir += Math.PI + (Math.random() - 0.5);
      }
      o.rotation.y += o.userData.spinSpeed * dt;
    }

    for (const f of foods) {
      const pulse = 1 + Math.sin(now * 0.004 + f.userData.phase) * 0.15;
      f.scale.set(pulse, pulse, pulse);
    }

    for (const m of motes) {
      m.position.y += Math.sin(now * 0.001 + m.userData.phase) * 0.002;
      m.position.x += Math.cos(now * 0.0007 + m.userData.phase) * 0.003;
    }

    // slow ambient light shift, like passing clouds
    sun.intensity = 0.9 + Math.sin(now * 0.0002) * 0.15;
  }

  function update(dt) {
    const origin = fly.position.clone();
    const lookDist = 5;
    const obstacles = allObstacles();
    const clearances = rayAngles.map(a => castRay(origin, heading + a, lookDist));
    const blocked = clearances[2] < 2.5;

    let target = null, bestDist = Infinity;
    for (const f of foods) {
      const d = f.position.distanceTo(origin);
      if (d < bestDist) { bestDist = d; target = f; }

    // the blocked rays are, instead of a fixed-angle binary turn
    const lookDistFull = lookDist;
    let avoidX = 0, avoidZ = 0, minClearance = lookDistFull;
    rayAngles.forEach((a, i) => {
      const c = clearances[i];

        const urgency = 1 - c / lookDistFull; // 0 (just visible) .. 1 (right on top of it)
        const rayDir = heading + a;

        avoidX -= Math.sin(rayDir) * urgency * urgency;
        avoidZ -= Math.cos(rayDir) * urgency * urgency;

    let speedMultiplier = 1.0;
    if (blocked) {
      mode = "avoiding";
      if (avoidX !== 0 || avoidZ !== 0) {
        desiredHeading = Math.atan2(avoidX, avoidZ);
      } else {
        // fully surrounded / directly nose-on -- fall back to turning
        // toward whichever side has more room, plus a bigger kick so it
        // doesn't get stuck oscillating nose-first into the same spot
        const leftClear = clearances[0] + clearances[1];
        const rightClear = clearances[3] + clearances[4];
        desiredHeading = heading + (leftClear > rightClear ? -1 : 1) * 2.0;
      }
      // slow down the closer the obstacle is, so steering has time to
      // actually turn the fly before it reaches the obstacle
      speedMultiplier = Math.max(0.15, minClearance / 2.5);

      // this is the sensory input we feed into the real EB circuit,
      // same convention as the Python bump_test.py experiments
      const toFood = target.position.clone().sub(origin);

        desiredHeading = heading + decodeResult.angle;
      } else {
        // circuit didn't produce enough spikes to decode this frame --
        // honest fallback, clearly labeled as such
        mode = "seeking (fallback)";
        desiredHeading = absoluteBearing;
      }

      mode = "wandering";
      desiredHeading += (Math.random() - 0.5) * 0.4;

    heading += Math.max(-turnRate * dt, Math.min(turnRate * dt, diff));

    // the AI above misjudges a corner or a fast-moving living obstacle.
    for (const o of obstacles) {
      const toFly = fly.position.clone().sub(o.position);
      toFly.y = 0;
      const minDist = (o.userData.radius || 1) + 0.5;
      const dist = toFly.length();
      if (dist < minDist && dist > 0.0001) {
        const pushOut = toFly.normalize().multiplyScalar(minDist - dist);
        fly.position.add(pushOut);
      }
    }
    fly.position.y = 1.2 + Math.sin(performance.now() * 0.006) * 0.08;
    fly.rotation.y = heading;

    const flap = Math.sin(performance.now() * 0.03) * 0.6;
    wingL.rotation.z = flap; wingR.rotation.z = -flap;

    if (target && target.position.distanceTo(fly.position) < 1.0) {
      scene.remove(target);
      foods.splice(foods.indexOf(target), 1);
      spawnFood();
      score++;
      document.getElementById("score").textContent = score;
    }

    document.getElementById("mode").textContent = mode;

    const camTarget = fly.position.clone().add(new THREE.Vector3(-Math.sin(heading) * 5, 3.2, -Math.cos(heading) * 5));
    camera.position.lerp(camTarget, 0.06);
    camera.lookAt(fly.position.x, fly.position.y + 0.3, fly.position.z);
  }

  let last = performance.now();
  function loop() {
    const now = performance.now();
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    updateEnvironment(now, dt);
    update(dt);
    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  window.addEventListener("resize", () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
})();
</script>
</body>
</html>
